name: CD MLOps

on:
  push:
    branches:
      - 'main'
    paths:
      - 'llmops/**'

jobs:
  deploy:
    if: false # skip — LLMOps features (Vector Search, Lakebase, Genie) not available on Free Edition
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [acc, prd]
    environment: ${{ matrix.environment }}
    permissions:
      contents: write # to push tag
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@2260866f83a41a2df55e1cfe7ffe038b78325bf6 #v0.295.0
        with:
          version: 0.295.0

      - name: Install uv
        uses: astral-sh/setup-uv@0cec208311dfd045dd5311c1add060b2062131d57 #v8.0.0

      - name: Deploy to Databricks
        env:
          DATABRICKS_BUNDLE_ENV: ${{ matrix.environment }}
        run: databricks bundle deploy --var="git_sha=${{ github.sha }}"
